<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="A map of AI conferences and their regional satellite events. See where and when each one takes place, and attend the one closest to you to travel less."
    />
    <meta name="color-scheme" content="light dark" />
    <title>confmaps: map of AI conferences and their satellite events</title>
    <link rel="canonical" href="https://confmaps.org/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="confmaps" />
    <meta
      property="og:title"
      content="confmaps: map of AI conferences and their satellite events"
    />
    <meta
      property="og:description"
      content="A map of AI conferences and their regional satellite events. See where and when each one takes place, and attend the one closest to you to travel less."
    />
    <meta property="og:url" content="https://confmaps.org/" />
    <meta property="og:image" content="https://confmaps.org/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A world map with pins for AI conferences, and the title confmaps: AI conferences and their satellites. Attend closer, fly less."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://confmaps.org/og.png" />
    <meta
      name="twitter:image:alt"
      content="A world map with pins for AI conferences, and the title confmaps: AI conferences and their satellites. Attend closer, fly less."
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          { "@type": "WebSite", "name": "confmaps", "url": "https://confmaps.org/" },
          {
            "@type": "WebApplication",
            "name": "confmaps",
            "url": "https://confmaps.org/",
            "description": "A map of AI conferences and their regional satellite events. See where and when each one takes place, and attend the one closest to you to travel less.",
            "applicationCategory": "ReferenceApplication",
            "operatingSystem": "Any",
            "isAccessibleForFree": true,
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
          }
        ]
      }
    </script>
    <script>
      // Pre-paint theme (avoids a flash). Mirrors src/lib/state/theme.ts (key: confmaps:theme).
      (function () {
        var t = 'system';
        try {
          t = localStorage.getItem('confmaps:theme') || 'system';
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
