<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="A map of AI conferences and their regional satellite events, to help you attend the one closest to you."
    />
    <meta name="color-scheme" content="light dark" />
    <title>confmaps</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Pre-paint theme (avoids a flash). Mirrors src/lib/state/theme.ts (key: confmaps:theme).
      (function () {
        var t = 'system';
        try {
          t = localStorage.getItem('confmaps:theme') || 'system';
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
