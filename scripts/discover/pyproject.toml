[project]
name = "confmaps-discover"
version = "0.1.0"
description = "Satellite discovery agent for confmaps.org (DESIGN.md §3): proposes data/satellites.yml changes by PR."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.1.0",
    "httpx>=0.28.1",
    "rich>=15.0.0",
    "ruamel-yaml>=0.19.1",
]

[project.scripts]
discover = "discover.main:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "discover"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
