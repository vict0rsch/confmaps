name: Discover satellites

# Runs the discovery agent (scripts/discover, DESIGN.md §4) and proposes changes to
# data/satellites.yml (modes upcoming, backfill) or data/past_conferences.yml (mode past,
# docs/backfill-spec.md §5) in one PR. The PR is never merged automatically. Two jobs:
# - research: read-only token, and the only job that sees ANTHROPIC_API_KEY (environment
#   `discovery`). It reads untrusted web pages, writes the curated file, rebuilds the generated
#   files (`pnpm data:build`: upstream clone, geocoding, data.json, archive) and validates them,
#   then uploads the data files with the PR title/body as an artifact. It cannot push.
# - propose: no Anthropic key, runs no code from the repository or the artifact (only git, gh
#   and jq); commits the data files, pushes a branch, opens the PR and dispatches CI.
#
# Repository setup:
# - Environment `discovery` holding the ANTHROPIC_API_KEY secret. Restrict its deployment
#   branches to `main`; optionally add required reviewers (each run then waits for approval).
# - Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests"
#   must be enabled, or `gh pr create` with GITHUB_TOKEN fails.
# - PRs opened with GITHUB_TOKEN do not trigger `pull_request` workflows, so CI is started with
#   `gh workflow run ci.yml` on the PR branch (needs `actions: write` here and a
#   `workflow_dispatch` trigger in ci.yml). The more standard alternative is a GitHub App
#   installation token or a fine-grained PAT (contents + pull requests: write) for the
#   propose job: PRs it opens trigger CI normally and no dispatch is needed.
#
# Manual runs (Actions → Discover satellites → Run workflow, or `gh workflow run discover.yml
# -f mode=past -f series=neurips,icml -f since=1987`): the inputs reach the script only through
# env and are validated by its argparse. `backfill` researches every past edition with a city
# (one API call each, up to max_usd): prefer a local run with `--only ID,...`. For `past`, dry-run
# one series locally first and set max_usd from the measured cost.
#
# Actions are pinned to commit SHAs (version in the trailing comment).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'upcoming: next 12 months; backfill: past editions (needs since); past: past main editions (needs series, since)'
        type: choice
        options: [upcoming, backfill, past]
        default: upcoming
      series:
        description: 'past: series key(s), comma-separated (e.g. neurips,icml)'
        type: string
        default: ''
      since:
        description: 'backfill / past: first year'
        type: string
        default: ''
      until:
        description: 'past: last year (default: last year)'
        type: string
        default: ''
      recheck:
        description: 'past: also re-verify the imported (source: pwc) editions in the range'
        type: boolean
        default: false
      max_usd:
        description: 'Budget: no further API calls once the estimated cost exceeds it (USD)'
        type: string
        default: '5'
  # Weekly run: enable after reviewing dry-run cost.
  # schedule:
  #   - cron: '23 6 * * 1' # Mondays, 06:23 UTC

permissions: {}

concurrency:
  group: discover
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: discovery
    permissions:
      contents: read
    outputs:
      changes: ${{ steps.discover.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: scripts/discover/uv.lock
      - run: uv sync --project scripts/discover --locked
      # No workflow inputs or event data are interpolated into `run:`: they reach the script
      # as env values, each passed as one `--flag=value` argument (a value can never become
      # another option) and validated by its argparse (choices, year ranges, series keys).
      # The secret reaches the script only through env, in this step only. The script strips
      # it (and any GitHub token) from the environment of the pnpm commands it runs.
      - name: Run discovery
        id: discover
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OUT: ${{ runner.temp }}/proposal
          RESULTS: ${{ runner.temp }}/results
          MODE: ${{ inputs.mode || 'upcoming' }}
          SERIES: ${{ inputs.series }}
          SINCE: ${{ inputs.since }}
          UNTIL: ${{ inputs.until }}
          RECHECK: ${{ inputs.recheck }}
          MAX_USD: ${{ inputs.max_usd || '5' }}
        run: |
          set +e
          args=("--mode=$MODE" "--max-usd=$MAX_USD" --results-dir "$RESULTS" --out-dir "$OUT")
          if [ -n "$SERIES" ]; then args+=("--series=$SERIES"); fi
          if [ -n "$SINCE" ]; then args+=("--since=$SINCE"); fi
          if [ -n "$UNTIL" ]; then args+=("--until=$UNTIL"); fi
          if [ "$RECHECK" = true ]; then args+=(--recheck); fi
          uv run --project scripts/discover --locked discover "${args[@]}"
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # pr.json exists only when there are changes and data:build + data:validate passed;
          # the data files the PR carries are then under $OUT/data/.
          if [ -f "$OUT/pr.json" ]; then
            echo "changes=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload the proposal
        if: steps.discover.outputs.changes == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proposal
          path: ${{ runner.temp }}/proposal/
          if-no-files-found: error
          retention-days: 7
      # Paid API results, to re-run the checks locally with `discover --from-results DIR`.
      - name: Upload the API results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-results
          path: ${{ runner.temp }}/results/
          if-no-files-found: ignore
          retention-days: 14
      # Conferences without a usable result (API error, refusal, budget, ...) fail this job;
      # a PR for the others is still proposed.
      - name: Fail on incomplete research
        if: steps.discover.outputs.rc != '0'
        run: exit 1

  propose:
    needs: research
    if: ${{ !cancelled() && needs.research.outputs.changes == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write # gh workflow run ci.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: proposal
          path: ${{ runner.temp }}/proposal
      # Only these data paths are taken from the artifact (archive: year files only;
      # past_conferences.yml when present); nothing in it is executed.
      - name: Commit the proposed data files
        id: commit
        env:
          P: ${{ runner.temp }}/proposal
        run: |
          for f in satellites.yml geocache.json build/data.json; do
            cp -- "$P/data/$f" "data/$f"
          done
          if [ -f "$P/data/past_conferences.yml" ]; then
            cp -- "$P/data/past_conferences.yml" data/past_conferences.yml
          fi
          for f in "$P"/data/archive/*.json; do
            name="$(basename -- "$f")"
            if [[ "$name" =~ ^[0-9]{4}\.json$ ]]; then cp -- "$f" "data/archive/$name"; fi
          done
          branch="discover/$(date -u +%Y-%m-%d-%H%M%S)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add -- data/satellites.yml data/geocache.json data/build/data.json data/archive
          if [ -f data/past_conferences.yml ]; then git add -- data/past_conferences.yml; fi
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "$(jq -r .title "$P/pr.json")"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - name: Push the branch
        if: steps.commit.outputs.branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.commit.outputs.branch }}
        run: >-
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          "HEAD:refs/heads/$BRANCH"
      - name: Open the PR
        if: steps.commit.outputs.branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          P: ${{ runner.temp }}/proposal
        run: |
          # Draft when an addition has UNVERIFIED default fields or a cancelled past edition
          # must be removed by hand.
          draft=()
          if [ "$(jq -r .draft "$P/pr.json")" = true ]; then draft=(--draft); fi
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
            --title "$(jq -r .title "$P/pr.json")" --body-file "$P/pr-body.md" "${draft[@]}"
      - name: Run CI on the PR branch
        if: steps.commit.outputs.branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.commit.outputs.branch }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
