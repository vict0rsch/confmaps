name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Lets the discovery agent attach checks to its PR branch (`gh workflow run ci.yml --ref <branch>`):
  # PRs opened with GITHUB_TOKEN do not trigger `pull_request` workflows.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: the archive-shrink check reads the base commit's archive
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      # The archive at the base must still be fully present: the PR base, the commit before the
      # push, or (manual run on a branch) the merge-base with main.
      - name: Validate data
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) BASE="$PR_BASE" ;;
            push) BASE="$BEFORE" ;;
            *) BASE="$(git merge-base HEAD origin/main)" ;;
          esac
          # New branch (all-zeros `before`) or a manual run on main itself: use the parent commit.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] ||
             [ "$BASE" = "$(git rev-parse HEAD)" ]; then
            if git rev-parse --verify --quiet HEAD^1 >/dev/null; then BASE="$(git rev-parse HEAD^1)"
            else BASE=""; fi
          fi
          if [ -n "$BASE" ]; then
            pnpm data:validate --require-against "$BASE"
          else
            echo "Root commit: no base to compare the archive against."
            pnpm data:validate
          fi
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  # Warn-only (DESIGN §9): axe scans in light and dark. Never blocks merge; violations are printed
  # in the log and attached to the report.
  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:a11y
