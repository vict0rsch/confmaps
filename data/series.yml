# One entry per conference series: the year the series was first held, counted from the series'
# own official edition numbering. Read by the past-editions backfill; not shown in the app.
# A series with no sourced year has no entry.
#
# Keys are series keys (the normalized title, e.g. neurips). Fields: first_year (integer,
# 1950-2100; not later than the earliest edition in the dataset), sources (≥1 http(s) URL),
# notes?

