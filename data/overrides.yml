# Manual fixes keyed by location id (`<conferenceId>@main` or a satellite id). Fields replace the
# computed values: lat, lng (together; skips geocoding), name, city, country, venue, start, end
# (on `@main`, also the conference's dates), official, presents_papers, access, link, notes, and
# on `@main` only, deadlines (replaces the conference's list, upstream form; `[]` drops them all).
# `reason` is free text and is not emitted.

icassp25@main:
  deadlines: []
  reason: >-
    Upstream's only deadline (2025-09-18, GMT+02) is after the conference (6-11 Apr 2025); it is a
    copy of icassp26's. Dropped rather than guessed.

icassp26@main:
  start: '2026-05-04'
  end: '2026-05-08'
  reason: Upstream start/end say 2025; the official site says 4-8 May 2026 (https://2026.ieeeicassp.org).

neurips25@main:
  venue: San Diego Convention Center
  reason: Upstream venue also lists Mexico City, which is the neurips25-mexico-city satellite.

neurips26@main:
  venue: International Convention Centre, Sydney
  reason: >-
    Upstream venue is a sentence that also describes events in other cities; keep only the main
    venue it names ("International Convention Centre, Sydney, Australia (Main venue, Dec 6-12)").

uai26@main:
  start: '2026-08-17'
  end: '2026-08-21'
  reason: Upstream date text says 2025; the official site says Aug 17-21, 2026 (https://www.auai.org/uai2026/).

